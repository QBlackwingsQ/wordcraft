name: Sync Upstream

on:
  schedule:
    - cron: '0 17 * * *' # 17:00 UTC = 00:00 (เที่ยงคืน) ตามเวลาไทย
  workflow_dispatch:      # ปุ่มกด sync เองแบบ manual

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync upstream with GitHub CLI
        run: gh repo sync ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
